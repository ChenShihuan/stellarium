worker_processes 1;
pid /run/skyinstrument-website/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format site '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent';
    access_log /var/log/skyinstrument-website/access.log site;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10;
    client_body_timeout 10;
    send_timeout 15;
    client_max_body_size 1k;
    client_body_temp_path /run/skyinstrument-website/client;
    proxy_temp_path /run/skyinstrument-website/proxy;
    fastcgi_temp_path /run/skyinstrument-website/fastcgi;
    uwsgi_temp_path /run/skyinstrument-website/uwsgi;
    scgi_temp_path /run/skyinstrument-website/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name skyinstrument.cn www.skyinstrument.cn;
        root /srv/skyinstrument/website/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^/(privacy|credits)/$ /$1 permanent;
        error_page 404 /404.html;
        location ^~ /.well-known/acme-challenge/ { root /srv/skyinstrument/website/acme; }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri.html $uri/ =404; }
    }
}
